name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Preserve SPA routes on GitHub Pages
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          for route in contact generators services brands spare-parts privacy-policy terms-and-conditions \
            generators/cat-c18-generator \
            generators/cummins-c110d5 \
            generators/cummins-c33d5 \
            generators/fg-wilson-p110-3 \
            generators/fg-wilson-p22-5-1s \
            generators/perkins-1104a-generator \
            services/ats-panels \
            services/canopy-work \
            services/generator-maintenance \
            services/generator-purchase \
            services/generator-rental \
            services/generator-repair \
            services/generator-sales \
            services/spare-parts; do
            mkdir -p "frontend/dist/${route}"
            cp frontend/dist/index.html "frontend/dist/${route}/index.html"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
