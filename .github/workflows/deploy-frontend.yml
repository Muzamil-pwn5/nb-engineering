name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Preserve SPA routes on GitHub Pages
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          for route in contact generators services brands spare-parts guides privacy-policy terms-and-conditions \
            generators/cat-c18-generator \
            generators/cummins-c110d5 \
            generators/cummins-c33d5 \
            generators/fg-wilson-p110-3 \
            generators/fg-wilson-p22-5-1s \
            generators/perkins-1104a-generator \
            services/ats-panels \
            services/canopy-work \
            services/generator-maintenance \
            services/generator-purchase \
            services/generator-rental \
            services/generator-repair \
            services/generator-sales \
            services/spare-parts \
            guides/cat-c18-generator-capacity-and-applications \
            guides/cummins-c110d5-generator-guide \
            guides/cummins-c33d5-33-kva-guide \
            guides/fg-wilson-p110-3-110-kva-guide \
            guides/fg-wilson-p22-5-1s-small-generator-guide \
            guides/perkins-1104a-60-kva-generator-guide \
            guides/choosing-generator-size-kva-kw-loads \
            guides/generator-maintenance-checklist-and-service-intervals \
            guides/generator-sales-questions-before-you-buy \
            guides/generator-rental-planning-temporary-power \
            guides/generator-repair-symptoms-and-safe-troubleshooting \
            guides/ats-generator-automatic-transfer-switch-guide \
            guides/generator-repair-or-replacement-decision-guide \
            guides/generator-rental-or-buying-comparison \
            guides/generator-canopy-ventilation-access-planning \
            guides/generator-spare-parts-identification-guide \
            guides/generator-installation-site-readiness-checklist \
            guides/generator-fuel-use-operating-cost-basics \
            guides/comparing-generator-brands-and-models; do
            mkdir -p "frontend/dist/${route}"
            cp frontend/dist/index.html "frontend/dist/${route}/index.html"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
