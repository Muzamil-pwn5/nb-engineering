<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>NB Engineering & Services | Generator Solutions in Pakistan</title>

    <meta
      name="description"
      content="NB Engineering & Services provides generators, power generation solutions, installation, maintenance, and after-sales support for commercial, industrial, and residential requirements in Pakistan."
    />

    <meta
      name="keywords"
      content="NB Engineering, generators Pakistan, diesel generators Pakistan, generator sales, generator installation, generator maintenance, power generation solutions, Cummins generators, Perkins generators, FG Wilson generators, Caterpillar generators"
    />

    <meta
      name="author"
      content="NB Engineering & Services"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <link
      rel="canonical"
      href="https://nbengineerings.com/"
    />

    <!-- Company Logo / Favicon -->

    <link
      rel="icon"
      type="image/jpeg"
      href="/logo.jpeg"
    />

    <!-- Open Graph -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="NB Engineering & Services | Generator Solutions in Pakistan"
    />

    <meta
      property="og:description"
      content="Generator sales, power generation solutions, installation, maintenance, and after-sales support from NB Engineering & Services."
    />

    <meta
      property="og:url"
      content="https://nbengineerings.com/"
    />

    <meta
      property="og:site_name"
      content="NB Engineering & Services"
    />

    <meta
      property="og:image"
      content="https://nbengineerings.com/logo.jpeg"
    />

    <meta
      property="og:image:alt"
      content="NB Engineering & Services logo"
    />

    <!-- Twitter / Social Sharing -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="NB Engineering & Services | Generator Solutions in Pakistan"
    />

    <meta
      name="twitter:description"
      content="Generator sales, installation, maintenance, and power generation solutions for commercial, industrial, and residential requirements."
    />

    <meta
      name="twitter:image"
      content="https://nbengineerings.com/logo.jpeg"
    />

    <meta
      name="twitter:image:alt"
      content="NB Engineering & Services logo"
    />

    <!-- Basic Organization Information -->

    <meta
      property="og:locale"
      content="en_PK"
    />
  </head>

  <body>
    <form name="nb-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
